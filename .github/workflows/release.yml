name: Release

# Tag-driven release pipeline: push a vX.Y.Z tag, get a GitHub Release
# with a Developer ID signed + notarized + stapled app zip and a Sparkle
# appcast. In-app updates (Settings → Updates / ⌥⌘U) read appcast.xml
# from releases/latest/download — no App Store involved.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application"
#                               identity exported from Keychain Access
#                               (.p12, with private key)
#   MACOS_CERTIFICATE_PASSWORD  the .p12 export password
#   APPLE_NOTARY_KEY_P8         contents of the App Store Connect API key
#                               (AuthKey_XXXXXXXXXX.p8, role Developer)
#   APPLE_NOTARY_KEY_ID         its Key ID
#   APPLE_NOTARY_ISSUER         the Issuer ID (UUID) shown above the keys
#   SPARKLE_ED_PRIVATE_KEY      Sparkle EdDSA private key (appcast signing)
# The build fails loudly if any is missing: an unsigned or unnotarized
# "release" would be quarantined by Gatekeeper on every download.
on:
  push:
    tags: ["v*"]
  # Dry run of the full pipeline (build, sign, notarize, staple) without
  # publishing: the zip + appcast land in the run's artifacts instead of
  # a GitHub Release. Use it to validate secrets/toolchain changes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (no v prefix)"
        default: "0.0.0-ci"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install zig 0.14 (Ghostty v1.2.3 toolchain)
        run: |
          brew install zig@0.14 xcodegen
          echo "/opt/homebrew/opt/zig@0.14/bin" >> "$GITHUB_PATH"

      - name: Build libghostty + deps, generate project
        run: |
          # vendor/ is gitignored: clone ghostty at the pinned tag,
          # apply patches, fetch deps, build the xcframework.
          GHOSTTY_TAG=v1.2.3
          git clone --depth 1 --branch "$GHOSTTY_TAG" \
            https://github.com/ghostty-org/ghostty.git vendor/ghostty
          for patch in patches/*.patch; do
            git apply --directory=vendor/ghostty "$patch"
          done
          scripts/fetch-ghostty-deps.sh
          scripts/build-ghostty.sh
          xcodegen generate

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD secrets are not set"
            exit 1
          fi
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p build "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"   # never auto-lock
          security unlock-keychain -p build "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Let Apple's tools use the key without a SecurityAgent prompt
          # (there is nobody to click it on a runner).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k build "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning

      - name: Notary service credentials
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -z "$APPLE_NOTARY_KEY_P8" ] || [ -z "$APPLE_NOTARY_KEY_ID" ] || [ -z "$APPLE_NOTARY_ISSUER" ]; then
            echo "::error::APPLE_NOTARY_KEY_P8 / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER secrets are not set"
            exit 1
          fi
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # scripts/release.sh reads these instead of a keychain profile.
          {
            echo "PIGEON_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "PIGEON_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "PIGEON_NOTARY_ISSUER=$APPLE_NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        run: |
          # Same script as a local release: Release config, Developer ID,
          # hardened runtime, Sparkle components re-signed, notarytool
          # --wait, stapler. Produces dist/Pigeon-<version>.zip.
          scripts/release.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --build "${{ steps.ver.outputs.build }}"

      - name: Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi
          VERSION=${{ steps.ver.outputs.version }}
          BUILD=${{ steps.ver.outputs.build }}
          ASSET_URL="https://github.com/ahpxex/pigeon/releases/download/v${VERSION}/Pigeon-${VERSION}.zip"
          # Signs the final (stapled) zip — the bytes users download.
          /usr/bin/swift scripts/generate-appcast.swift \
            "dist/Pigeon-${VERSION}.zip" \
            "$VERSION" "$BUILD" "$ASSET_URL" "$SPARKLE_ED_PRIVATE_KEY"

      - name: Upload artifacts (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Pigeon-${{ steps.ver.outputs.version }}
          path: |
            dist/Pigeon-${{ steps.ver.outputs.version }}.zip
            appcast.xml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          gh release create "v${VERSION}" \
            "dist/Pigeon-${VERSION}.zip" \
            "appcast.xml" \
            --title "Pigeon ${VERSION}" \
            --generate-notes
