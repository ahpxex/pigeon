name: Pigeon
options:
  bundleIdPrefix: dev.ahpx
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

packages:
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.1.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    branch: main
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX
    exactVersion: 0.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

targets:
  Pigeon:
    type: application
    platform: macOS
    sources:
      - path: Sources/Pigeon
    dependencies:
      # libghostty, built from vendor/ghostty by scripts/build-ghostty.sh.
      # Static library xcframework, so no embedding.
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      # highlight.js wrapper with a modern async API (AttributedString,
      # auto language detection, dark-mode-syncing themes) for the file
      # browser's code preview.
      - package: HighlightSwift
      # Full CommonMark rendering (tables, task lists, blockquotes,
      # images) for the file browser's markdown preview.
      - package: MarkdownUI
      # libgit2 1.9 wrapper (status/diff/patch/log/commit/...) for the
      # built-in Git view.
      - package: SwiftGitX
      # In-app self-update (non-App-Store): appcast + EdDSA signatures.
      - package: Sparkle
    info:
      path: Sources/Pigeon/Info.plist
      properties:
        CFBundleDisplayName: $(PIGEON_APP_NAME)
        CFBundleName: $(PIGEON_APP_NAME)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # Sparkle: update feed + EdDSA public key (private key lives only
        # in GitHub secrets; see ~/.config/pigeon-dev-secrets/).
        SUFeedURL: https://github.com/ahpxex/pigeon/releases/latest/download/appcast.xml
        SUPublicEDKey: rNazB3r6n926/1wN4tyQ4uVCf4g1Te/pjY0OqGzSAZM=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Version injected at build time (CI passes MARKETING_VERSION from
        # the tag; local builds default in settings below).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libghostty statically links C++ dependencies (harfbuzz, etc.)
        OTHER_LDFLAGS: "-lstdc++"
        # Stable local identity (created by scripts/dev-signing-setup.sh):
        # ad-hoc signing would give every rebuild a new code identity and
        # re-trigger the Keychain password prompt for stored API keys.
        CODE_SIGN_IDENTITY: "Pigeon Dev"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
        # A terminal cannot be sandboxed: it must spawn shells with full
        # user privileges (same as Ghostty, iTerm2, Terminal.app).
        ENABLE_APP_SANDBOX: false
      configs:
        # Debug is a separate app ("Pigeon Dev") so it runs side by side
        # with the installed production Pigeon: its own bundle ID (own
        # UserDefaults, own LaunchServices identity — `open` starts a
        # second instance instead of activating prod), its own config dir
        # (~/.config/pigeon-dev, derived from the bundle ID suffix in
        # AppVariant.swift), and a DEV-badged icon.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.ahpx.pigeon.dev
          PIGEON_APP_NAME: Pigeon Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.ahpx.pigeon
          PIGEON_APP_NAME: Pigeon
    postBuildScripts:
      # libghostty locates its runtime resources (terminfo, shell
      # integration) at Contents/Resources/{ghostty,terminfo} relative to
      # the app bundle, same layout as Ghostty.app.
      - name: Copy Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SHARE="$SRCROOT/vendor/ghostty/zig-out/share"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ ! -d "$SHARE/ghostty" ]; then
            echo "error: vendor/ghostty/zig-out/share/ghostty not found. Run scripts/build-ghostty.sh first." >&2
            exit 1
          fi
          mkdir -p "$RES"
          rsync -a --delete "$SHARE/ghostty/" "$RES/ghostty/"
          rsync -a --delete "$SHARE/terminfo/" "$RES/terminfo/"
          # Terminal-native agent: extend the zsh shell integration with
          # the command_not_found_handler that routes natural language to
          # the built-in agent.
          cat "$SRCROOT/scripts/pigeon-integration.zsh" >> "$RES/ghostty/shell-integration/zsh/ghostty-integration"
