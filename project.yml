name: Pigeon
options:
  bundleIdPrefix: dev.ahpx
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

packages:
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.1.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    branch: main
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX
    exactVersion: 0.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

targets:
  Pigeon:
    type: application
    platform: macOS
    sources:
      - path: Sources/Pigeon
    dependencies:
      # libghostty, built from vendor/ghostty by scripts/build-ghostty.sh.
      # Static library xcframework, so no embedding.
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      # highlight.js wrapper with a modern async API (AttributedString,
      # auto language detection, dark-mode-syncing themes) for the file
      # browser's code preview.
      - package: HighlightSwift
      # Full CommonMark rendering (tables, task lists, blockquotes,
      # images) for the file browser's markdown preview.
      - package: MarkdownUI
      # libgit2 1.9 wrapper (status/diff/patch/log/commit/...) for the
      # built-in Git view.
      - package: SwiftGitX
      # In-app self-update (non-App-Store): appcast + EdDSA signatures.
      - package: Sparkle
    info:
      path: Sources/Pigeon/Info.plist
      properties:
        CFBundleDisplayName: $(PIGEON_APP_NAME)
        CFBundleName: $(PIGEON_APP_NAME)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # TCC usage strings: a program running inside the terminal is
        # attributed to Pigeon, so the prompts name Pigeon. Paired with
        # the hardened-runtime entitlements in Pigeon.entitlements.
        NSAppleEventsUsageDescription: A program running within Pigeon would like to use AppleScript.
        NSCameraUsageDescription: A program running within Pigeon would like to use the camera.
        NSMicrophoneUsageDescription: A program running within Pigeon would like to use your microphone.
        NSContactsUsageDescription: A program running within Pigeon would like to access your Contacts.
        NSCalendarsUsageDescription: A program running within Pigeon would like to access your Calendar.
        NSLocationUsageDescription: A program running within Pigeon would like to access your location.
        NSPhotoLibraryUsageDescription: A program running within Pigeon would like to access your Photos.
        NSLocalNetworkUsageDescription: A program running within Pigeon would like to access the local network.
        # Sparkle: update feed + EdDSA public key (private key lives only
        # in GitHub secrets; see ~/.config/pigeon-dev-secrets/).
        SUFeedURL: https://github.com/ahpxex/pigeon/releases/latest/download/appcast.xml
        SUPublicEDKey: rNazB3r6n926/1wN4tyQ4uVCf4g1Te/pjY0OqGzSAZM=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Version injected at build time (CI passes MARKETING_VERSION from
        # the tag; local builds default in settings below).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libghostty statically links C++ dependencies (harfbuzz, etc.)
        OTHER_LDFLAGS: "-lstdc++"
        CODE_SIGN_STYLE: Manual
        # Hardened runtime in every configuration so Debug exercises the
        # same TCC rules the notarized build ships with (lldb still
        # attaches: xcodebuild injects get-task-allow for the `build`
        # action; scripts/release.sh turns that off). Entitlements are
        # per configuration below.
        ENABLE_HARDENED_RUNTIME: true
        # A terminal cannot be sandboxed: it must spawn shells with full
        # user privileges (same as Ghostty, iTerm2, Terminal.app).
        ENABLE_APP_SANDBOX: false
      configs:
        # Debug is a separate app ("Pigeon Dev") so it runs side by side
        # with the installed production Pigeon: its own bundle ID (own
        # UserDefaults, own LaunchServices identity — `open` starts a
        # second instance instead of activating prod), its own config dir
        # (~/.config/pigeon-dev, derived from the bundle ID suffix in
        # AppVariant.swift), and a DEV-badged icon.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.ahpx.pigeon.dev
          PIGEON_APP_NAME: Pigeon Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          # Stable local identity (scripts/dev-signing-setup.sh): ad-hoc
          # signing would give every rebuild a new code identity.
          CODE_SIGN_IDENTITY: "Pigeon Dev"
          CODE_SIGN_ENTITLEMENTS: Sources/Pigeon/PigeonDebug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.ahpx.pigeon
          PIGEON_APP_NAME: Pigeon
          # Distribution outside the App Store: Developer ID + hardened
          # runtime + notarization (scripts/release.sh). Anything else
          # (ad-hoc, self-signed) is quarantined by Gatekeeper on
          # download. Xcode picks the "Developer ID Application" cert
          # of this team from the keychain.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: L7GVXT64TV
          CODE_SIGN_ENTITLEMENTS: Sources/Pigeon/Pigeon.entitlements
          # Secure (Apple TSA) timestamp on the app's own signature —
          # notarization rejects signatures without one, and the plain
          # `build` action does not add it on its own.
          OTHER_CODE_SIGN_FLAGS: --timestamp
    postBuildScripts:
      # libghostty locates its runtime resources (terminfo, shell
      # integration) at Contents/Resources/{ghostty,terminfo} relative to
      # the app bundle, same layout as Ghostty.app.
      - name: Copy Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SHARE="$SRCROOT/vendor/ghostty/zig-out/share"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ ! -d "$SHARE/ghostty" ]; then
            echo "error: vendor/ghostty/zig-out/share/ghostty not found. Run scripts/build-ghostty.sh first." >&2
            exit 1
          fi
          mkdir -p "$RES"
          rsync -a --delete "$SHARE/ghostty/" "$RES/ghostty/"
          rsync -a --delete "$SHARE/terminfo/" "$RES/terminfo/"
          # Terminal-native agent: extend the zsh shell integration with
          # the command_not_found_handler that routes natural language to
          # the built-in agent.
          cat "$SRCROOT/scripts/pigeon-integration.zsh" >> "$RES/ghostty/shell-integration/zsh/ghostty-integration"
      # Sparkle ships its nested executables (XPC services, Autoupdate,
      # Updater.app) ad-hoc signed, and Xcode's "code sign on copy" only
      # re-signs the framework's outer bundle. Notarization requires
      # every nested Mach-O to be Developer ID signed with the hardened
      # runtime, so re-sign inside-out with this build's identity (the
      # app itself is sealed by Xcode's own CodeSign step afterwards,
      # which covers the framework's new seal). Same as Ghostty's
      # release workflow.
      - name: Sign Sparkle components
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FW="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [ -d "$FW" ] || exit 0
          IDENTITY="$EXPANDED_CODE_SIGN_IDENTITY"
          [ -n "$IDENTITY" ] || IDENTITY="-"
          FLAGS="--force"
          [ "$ENABLE_HARDENED_RUNTIME" = "YES" ] && FLAGS="$FLAGS --options runtime"
          # Secure timestamps are a notarization requirement; a
          # self-signed or ad-hoc identity cannot get one.
          case "$EXPANDED_CODE_SIGN_IDENTITY_NAME" in
            "Developer ID"*|"Apple Distribution"*|"3rd Party Mac"*) FLAGS="$FLAGS --timestamp" ;;
            *) FLAGS="$FLAGS --timestamp=none" ;;
          esac
          V="$FW/Versions/Current"
          for item in \
              "$V/XPCServices/Downloader.xpc" \
              "$V/XPCServices/Installer.xpc" \
              "$V/Autoupdate" \
              "$V/Updater.app" \
              "$FW"; do
            [ -e "$item" ] || continue
            /usr/bin/codesign $FLAGS --sign "$IDENTITY" "$item"
          done
